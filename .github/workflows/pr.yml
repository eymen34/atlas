name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, Maven, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify (unit + Failsafe integration via Testcontainers)
        run: ./mvnw -pl api -am --batch-mode --no-transfer-progress verify

      # T-010: `mvn verify` re-dumps /v3/api-docs over the committed spec via the
      # specgen-build profile. If the regenerated spec differs from what was
      # committed, the author forgot to run verify + commit the new spec.
      - name: Check OpenAPI spec drift
        run: |
          git diff --exit-code api/src/main/resources/openapi/openapi.json || \
          (echo "OpenAPI spec changed but committed openapi/openapi.json not updated — run mvn verify and commit the spec" && exit 1)

  frontend:
    name: Frontend (Vite, TypeScript 6, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Assert no Tailwind v3 config
        working-directory: ${{ github.workspace }}
        run: bash scripts/assert-no-tailwind-config.sh

      - name: Assert no TS suppressions
        working-directory: ${{ github.workspace }}
        run: bash scripts/assert-no-ts-suppressions.sh

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: npm audit (HIGH/CRITICAL block)
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Docker build (production image, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --progress=plain \
            -t atlas:ci-test \
            .

      - name: Assert image size <= 512 MiB
        run: |
          set -euo pipefail
          # 512 MiB budget. Raised from 450 in T-025: AWS SDK v2 (S3 presigning)
          # is a permanent dependency that pushed the fat jar past the old budget.
          # Image is jre-noble (~250 MB) + fat jar (frontend + AWS SDK) + AppCDS
          # archive. SDK transitive trim (exclude apache-client / netty-nio-client;
          # url-connection-client is already the sync choice) + jlink-stripped
          # minimal JRE are a separate optimization ticket (with the GHCR backlog).
          MAX=536870912
          SIZE="$(docker image inspect atlas:ci-test --format '{{.Size}}')"
          echo "image size: ${SIZE} bytes (max ${MAX})"
          if [ "${SIZE}" -gt "${MAX}" ]; then
            echo "::error::atlas:ci-test image exceeds 512 MiB budget (${SIZE} > ${MAX})"
            exit 1
          fi

      - name: Assert AppCDS archive layer is present and non-trivial
        run: |
          set -euo pipefail
          # docker history surfaces the COPY directive that landed app.jsa.
          HISTORY="$(docker history atlas:ci-test --no-trunc --format '{{.Size}}\t{{.CreatedBy}}')"
          echo "${HISTORY}"
          LINE="$(echo "${HISTORY}" | grep 'app\.jsa' | head -n1 || true)"
          if [ -z "${LINE}" ]; then
            echo "::error::no docker history layer references app.jsa — AppCDS archive missing"
            exit 1
          fi
          LAYER_SIZE_HUMAN="$(echo "${LINE}" | awk -F '\t' '{print $1}')"
          echo "app.jsa layer size (reported): ${LAYER_SIZE_HUMAN}"
          # Extract the actual archive byte size from inside the image.
          CID="$(docker create atlas:ci-test)"
          trap 'docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT
          BYTES="$(docker cp "${CID}:/app/app.jsa" - | wc -c)"
          echo "/app/app.jsa byte count (in image): ${BYTES}"
          if [ "${BYTES}" -le 1024 ]; then
            echo "::error::/app/app.jsa is suspiciously small (${BYTES} bytes <= 1024)"
            exit 1
          fi

      - name: Assert no docker push / login in this workflow
        run: |
          set -euo pipefail
          # Defense-in-depth: the docker-build job must never publish.
          # Exclude this guard's own descriptive lines (the step name and the
          # echo diagnostics legitimately contain the words "docker push /
          # login"); a real publish directive lives in a run: or uses: line.
          if grep -nE '(docker[[:space:]]+push|docker[[:space:]]+login|docker[/]login-action)' \
              .github/workflows/pr.yml \
              | grep -vE '(name:|echo |# )'; then
            echo "::error::pr.yml contains a docker push / login directive"
            exit 1
          fi

      - name: Assert no DB credentials baked into final image ENV
        run: |
          set -euo pipefail
          ENVS="$(docker inspect atlas:ci-test --format '{{range .Config.Env}}{{println .}}{{end}}')"
          echo "${ENVS}"
          if echo "${ENVS}" | grep -E '^(APP_DATABASE_PASSWORD|APP_DATABASE_USERNAME|APP_DATABASE_URL)='; then
            echo "::error::DB env vars must NOT be baked into the production image"
            exit 1
          fi

      - name: Assert container runs as non-root (uid 1000)
        run: |
          set -euo pipefail
          UID_OUT="$(docker run --rm --entrypoint id atlas:ci-test -u)"
          echo "container uid: ${UID_OUT}"
          if [ "${UID_OUT}" != "1000" ]; then
            echo "::error::container uid is ${UID_OUT}; expected 1000"
            exit 1
          fi

  e2e-smoke:
    name: Frontend e2e smoke (Playwright vs Vite preview :4173)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          # Browser binaries only. System apt packages (libnss3 etc.) are
          # NOT cached here — they're reinstalled on cache-hit via the
          # install-deps step below, which is fast and idempotent.
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend bundle
        run: npm run build

      - name: Run Playwright smoke (preview server auto-started by webServer)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  helm-lint:
    name: Helm lint + template (deploy/helm/tracker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint ./deploy/helm/tracker

      - name: helm template (default + ci-values overlay)
        run: |
          set -euo pipefail
          # Default render, then the ci-values overlay so the ingress branch is exercised.
          helm template tracker ./deploy/helm/tracker > /dev/null
          helm template tracker ./deploy/helm/tracker -f ./deploy/helm/tracker/ci-values.yaml > /dev/null

  pr-gate:
    name: PR gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build, e2e-smoke, helm-lint]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] \
              || [ "${{ needs.frontend.result }}" != "success" ] \
              || [ "${{ needs.docker-build.result }}" != "success" ] \
              || [ "${{ needs.e2e-smoke.result }}" != "success" ] \
              || [ "${{ needs.helm-lint.result }}" != "success" ]; then
            echo "::error::one or more required PR jobs failed"
            echo "backend=${{ needs.backend.result }}"
            echo "frontend=${{ needs.frontend.result }}"
            echo "docker-build=${{ needs.docker-build.result }}"
            echo "e2e-smoke=${{ needs.e2e-smoke.result }}"
            echo "helm-lint=${{ needs.helm-lint.result }}"
            exit 1
          fi
