name: Publish

# Publishes the production image to GHCR. Triggers ONLY on push to main and v* tags.
# Deliberately NO PR trigger — this workflow must never run on pull requests (including
# fork PRs, which would otherwise expose packages:write). PR validation lives in pr.yml,
# whose docker-build job builds the SAME /Dockerfile (no push).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eymen34/atlas
          tags: |
            # :latest on default-branch (main) pushes only — not on tag pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # :<short-sha> (7-char hex) on every push (main or tag)
            type=sha,prefix=,format=short
            # :<semver> on v* tag pushes (strips the leading 'v')
            type=semver,pattern={{version}}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          # Same context + Dockerfile as pr.yml's docker-build job. Stage-3 AppCDS env is
          # inline on the RUN directive, so NO build-args are needed.
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
