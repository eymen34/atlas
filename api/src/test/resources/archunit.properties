# Disable transitive JDK-class import. Our ArchUnit rules check class names
# by string (haveFullyQualifiedName), they do not need ArchUnit to actually
# parse java.* class files. Skipping that step avoids the
# "Unsupported class file major version 70" ASM noise when running on a
# JDK whose bytecode is newer than what ArchUnit's bundled ASM understands.
resolveMissingDependenciesFromClassPath=false
