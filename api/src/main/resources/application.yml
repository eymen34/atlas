# Atlas API — base configuration.
#
# Policy (per CONTRIBUTING.md):
#   * No application-{env}.yml profile files are committed to the repo.
#   * All secrets are supplied via environment variables; this file
#     only declares safe defaults and env-var mappings.
#   * DATABASE_URL must be a plain JDBC URL — pgBouncer-compatibility
#     parameters (prepareThreshold=0, preparedStatementCacheQueries=0,
#     tcpKeepAlive=true, socketTimeout=10) are appended programmatically
#     by DataSourceConfig. Do not pre-append them here.

server:
  port: 8080

spring:
  application:
    name: atlas-api
  jpa:
    open-in-view: false
    # PAIR-RULE (hibernate_cold_start): the two keys below
    #   * spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    #   * spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
    # MUST be set together. The metadata-access flag is a cold-start
    # optimization (saves ~200ms by skipping JDBC metadata introspection on
    # EntityManagerFactory creation); the explicit dialect is what allows
    # Hibernate to build the dialect WITHOUT that introspection. Removing
    # either half re-introduces the "Unable to determine Dialect without
    # JDBC metadata" boot failure. Stage 3 of /Dockerfile boots the JVM
    # without a reachable database to warm an AppCDS archive and depends on
    # BOTH halves being present.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        query:
          plan_cache_max_size: 512
        boot:
          allow_jdbc_metadata_access: false
  datasource:
    hikari:
      # DatabaseStartupValidator (SmartLifecycle) owns the fail-fast contract
      # end-to-end. -1 disables Hikari's eager pool initialization check so the
      # validator can produce a single, sanitized error message on failure.
      initialization-fail-timeout: -1
  # Flyway runs SQL-first, forward-only migrations on startup. See
  # /docs/migrations.md for the policy. baseline-on-migrate is deliberately
  # false so a non-empty database without a Flyway history table fails loudly
  # rather than silently baselining over unknown state.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        # Only health, info, and prometheus are exposed. /actuator/env,
        # /actuator/beans, /actuator/heapdump, etc. stay 404. The custom
        # /health and /ready endpoints (HealthController/ReadyController)
        # are the load-balancer-facing probes; /actuator/health is the
        # operator-facing aggregate that includes the DB indicator.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      # Explicit so the contract is visible: /actuator/health does perform
      # a DB ping. ObservabilityIntegrationTest does NOT assert on body
      # content because the included indicators can shift across Boot minor
      # versions.
      enabled: true

springdoc:
  api-docs:
    # Pin the OpenAPI document path so the springdoc upgrade path is
    # auditable. T-010 generates the frontend TS client against this URL.
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # T-011: springdoc 2.6.0 is built against Spring 6. On Spring Framework 7
  # (Boot 4) its generic-response builder calls the removed
  # ControllerAdviceBean(Object) constructor as soon as ANY @ControllerAdvice
  # bean exists (GlobalExceptionHandler), throwing NoSuchMethodError and 500-ing
  # /v3/api-docs. We declare per-endpoint @ApiResponses explicitly, so the
  # automatic merge of @ControllerAdvice @ExceptionHandler responses is not
  # needed — disable it. This is a config knob, NOT a version upgrade / shim /
  # autoconfig exclusion (see springdoc_boot4_aot_incompatibility). Re-evaluate
  # when springdoc ships a Boot-4-compatible release.
  override-with-generic-response: false

app:
  # T-023: feature flags. FEATURE_WATCHERS_ENABLED is NOT APP_-prefixed (same as
  # JWT_SECRET); default true. Surfaced unauthenticated via GET /api/config/public.
  feature:
    watchers:
      enabled: ${FEATURE_WATCHERS_ENABLED:true}
  cors:
    # Comma-separated list, trimmed by SecurityConfig. Default covers the
    # Vite dev server (:5173) and the Vite preview server (:4173) used by
    # the e2e-smoke Playwright job. Override via APP_CORS_ALLOWED_ORIGINS
    # in any deployed environment — never use "*" because
    # allowCredentials=true forbids the wildcard.
    allowed-origins: http://localhost:5173,http://localhost:4173
  database:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DATABASE_USERNAME:atlas}
    password: ${DATABASE_PASSWORD:}
    startup-check:
      # Toggle for the SmartLifecycle DB ping performed during context
      # refresh by DatabaseStartupValidator. Default true; ONLY set false
      # in stage 3 of /Dockerfile (AppCDS archive warm-up). Setting this
      # false in any deployment environment silently disables the
      # fail-fast contract. Exposed via /actuator/info
      # (databaseStartupCheck.enabled) for runtime visibility.
      enabled: true
