# T-010 spec-dump profile. Activated only by the build-time OpenAPI dump
# (spring-boot:start in the `specgen-build` Maven profile) so springdoc can
# serve /v3/api-docs with NO reachable database.
#
# Audit note: the base application.yml already supplies the no-JDBC Hibernate
# cold-start config (explicit PostgreSQLDialect +
# hibernate.boot.allow_jdbc_metadata_access=false) and Hikari
# initialization-fail-timeout=-1, so the DataSource bean is created without
# ever opening a connection. The only boot-time DB touchpoints left to disable
# are Flyway's migrate() and the DatabaseStartupValidator fail-fast ping.
#
# Not set here on purpose: H2 (the custom DataSourceConfig ignores
# spring.datasource.* and DatabaseProperties.url is regex-locked to a Postgres
# JDBC URL, so H2 cannot back this app) and JWT_SECRET (blank default, not
# required at boot).
spring.flyway.enabled=false
app.database.startup-check.enabled=false

# Loopback-only bind for the short-lived dump server.
server.address=127.0.0.1

# Make /v3/api-docs deterministic so the committed spec is byte-stable across
# machines and CI without an external normaliser (jq): sort object keys and
# pretty-print. Scoped to this profile, so production /v3/api-docs is untouched.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
