apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracker.fullname" . }}-config
  labels:
    {{- include "tracker.labels" . | nindent 4 }}
data:
  # NON-secret application env only (names mirror .env.example exactly). Secrets are in
  # the Secret referenced by the Deployment's envFrom secretRef — never here.
  # APP_DATABASE_STARTUP_CHECK_ENABLED is image-build-only and intentionally absent.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
