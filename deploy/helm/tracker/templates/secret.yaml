{{- if not .Values.existingSecret }}
# SKELETON Secret — rendered ONLY when existingSecret is empty. The placeholders are
# blank by design; supply real values via `--set secrets.JWT_SECRET=...` (dev/quick-start)
# or, for production, set `existingSecret` to a Secret you manage with sealed-secrets /
# external-secrets / vault and the chart will reference it instead of creating this one.
# Keys mirror .env.example EXACTLY.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracker.fullname" . }}
  labels:
    {{- include "tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  OUTBOX_DRAIN_SHARED_SECRET: {{ .Values.secrets.OUTBOX_DRAIN_SHARED_SECRET | quote }}
  APP_DATABASE_USERNAME: {{ .Values.secrets.APP_DATABASE_USERNAME | quote }}
  APP_DATABASE_PASSWORD: {{ .Values.secrets.APP_DATABASE_PASSWORD | quote }}
  SMTP_USERNAME: {{ .Values.secrets.SMTP_USERNAME | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.SMTP_PASSWORD | quote }}
  OBJECT_STORAGE_ACCESS_KEY: {{ .Values.secrets.OBJECT_STORAGE_ACCESS_KEY | quote }}
  OBJECT_STORAGE_SECRET_KEY: {{ .Values.secrets.OBJECT_STORAGE_SECRET_KEY | quote }}
{{- end }}
