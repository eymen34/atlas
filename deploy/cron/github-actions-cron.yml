# GitHub Actions scheduled drain (T-029). Copy into .github/workflows/ to activate.
#
# NOTE: GitHub's cron granularity is 5 minutes minimum, and scheduled runs can be delayed
# under load — fine for email/S3-delete latency, but use the k8s CronJob or Cloud Scheduler
# (both support every-minute) when you need tighter cadence.
#
# Set repo secrets: ATLAS_APP_URL, OUTBOX_DRAIN_SHARED_SECRET.
name: outbox-drain
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # allow manual runs
concurrency:
  group: outbox-drain
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain outbox
        env:
          APP_URL: ${{ secrets.ATLAS_APP_URL }}
          OUTBOX_DRAIN_SHARED_SECRET: ${{ secrets.OUTBOX_DRAIN_SHARED_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "X-Internal-Secret: ${OUTBOX_DRAIN_SHARED_SECRET}" \
            "${APP_URL}/internal/tasks/drain-outbox"
