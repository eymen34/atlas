# Atlas — local development stack.
#
# Run from repo root:
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml up --build --wait
#
# Services:
#   db          PostgreSQL 17 (pgdata persisted in postgres_data volume)
#   objectstore MinIO S3-compatible store (data in minio_data volume)
#   mc-init     one-shot bucket bootstrap, exits 0 when ready
#   mailhog     MailHog SMTP sink (T-029) — 1025 SMTP, 8025 web UI
#   app         atlas:dev built from /Dockerfile.dev, depends on the
#               above being healthy / completed
#
# No top-level `version:` key — modern Compose Specification (the legacy
# key triggers deprecation warnings and is ignored anyway).

services:
  db:
    image: postgres:17-alpine
    env_file: ["../.env"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # $$ double-dollar prevents Compose from interpolating these at
      # parse time; the postgres container needs to see them as literal
      # $POSTGRES_USER / $POSTGRES_DB so its shell can resolve them.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  objectstore:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: ["../.env"]
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console (http://localhost:9001)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mc-init:
    image: minio/mc:latest
    restart: on-failure
    depends_on:
      objectstore:
        condition: service_healthy
    env_file: ["../.env"]
    entrypoint: ["/bin/sh", "-c"]
    # WARNING — LOCAL DEVELOPMENT ONLY. The `mc anonymous set download`
    # line below makes every object in the bucket world-readable by
    # anonymous HTTP GET. Production MUST keep the bucket private and
    # serve objects exclusively via short-lived presigned URLs (per the
    # object_storage architecture decision). Do NOT lift this block into
    # any prod compose override.
    command:
      - |
        mc alias set local http://objectstore:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$OBJECT_STORAGE_BUCKET &&
        mc anonymous set download local/$$OBJECT_STORAGE_BUCKET

  # T-029: SMTP sink for outbox-driven email. MailHog accepts everything on 1025 and
  # exposes a web inbox at http://localhost:8025 — no real mail leaves the machine.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI (http://localhost:8025)

  app:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    image: atlas:dev
    depends_on:
      db:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      mc-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    ports:
      - "8080:8080"
    env_file: ["../.env"]
    # .env points SMTP_HOST at localhost (host-side dev); inside the compose network the
    # broker is the `mailhog` service, so override just that key here.
    environment:
      SMTP_HOST: mailhog
    healthcheck:
      # /ready performs a DB ping; this gates `docker compose up --wait`
      # on the app actually serving traffic, not just having a PID.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data: {}
  minio_data: {}
